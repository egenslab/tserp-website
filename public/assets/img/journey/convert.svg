<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110"><style>.drop{animation:drop 2.4s ease-in infinite}.drop2{animation-delay:.8s}.drop3{animation-delay:1.6s}.dash{animation:dash 1s linear infinite}.tick{transform-box:fill-box;transform-origin:center;animation:tick 2.4s ease-in-out infinite}@keyframes drop{0%{transform:translate(0,0);opacity:1}60%{transform:translate(var(--x),18px);opacity:1}100%{transform:translate(var(--x),30px);opacity:0}}@keyframes dash{to{stroke-dashoffset:-8}}@keyframes tick{0%,55%{transform:scale(.6);opacity:.4}70%{transform:scale(1.15);opacity:1}85%,100%{transform:scale(1);opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><path d="M14 16h72l-26 30v24l-20 10V46z" fill="#e9fbdc" stroke="#184332" stroke-width="3" stroke-linejoin="round"/><circle class="drop" style="--x:16px" cx="34" cy="24" r="4" fill="#184332"/><circle class="drop drop2" style="--x:0px" cx="50" cy="22" r="4" fill="#184332"/><circle class="drop drop3" style="--x:-16px" cx="66" cy="24" r="4" fill="#184332"/><circle cx="50" cy="40" r="4" fill="#92ef59" stroke="#184332" stroke-width="2"/><path class="dash" d="M62 66h22" stroke="#184332" stroke-width="3" stroke-dasharray="4 4"/><g transform="translate(88 40)"><rect width="58" height="46" rx="8" fill="#184332"/><path d="M0 16h58" stroke="#92ef59" stroke-width="2" stroke-dasharray="3 3"/><rect x="8" y="6" width="28" height="5" rx="2.5" fill="#92ef59"/><rect x="8" y="24" width="20" height="4" rx="2" fill="#cfe0d6"/><rect x="8" y="32" width="30" height="4" rx="2" fill="#cfe0d6"/><g class="tick"><circle cx="46" cy="32" r="9" fill="#92ef59"/><path d="M41.5 32l3 3 6-6" stroke="#184332" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g></svg>
