<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110"><style>.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}.globe{transform-box:fill-box;transform-origin:center;animation:spin 6s linear infinite}.cursor{animation:cur 3s ease-in-out infinite}.btn{transform-box:fill-box;transform-origin:center;animation:press 3s ease-in-out infinite}.ln{animation:type 3s ease-in-out infinite;transform-box:fill-box;transform-origin:left}@keyframes pulse{50%{transform:scale(1.25);opacity:.15}}@keyframes spin{to{transform:rotateY(360deg)}}@keyframes cur{0%,100%{transform:translate(0,0)}45%,60%{transform:translate(-14px,-10px)}}@keyframes press{0%,45%,70%,100%{transform:scale(1)}55%{transform:scale(.85)}}@keyframes type{0%{transform:scaleX(.2)}40%,100%{transform:scaleX(1)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><circle class="pulse" cx="128" cy="22" r="14" fill="#92ef59" opacity=".35"/><rect x="18" y="16" width="112" height="78" rx="10" fill="#fff" stroke="#184332" stroke-width="3"/><path d="M18 30h112" stroke="#184332" stroke-width="3"/><circle cx="28" cy="23" r="2.5" fill="#f87171"/><circle cx="36" cy="23" r="2.5" fill="#fbbf24"/><circle cx="44" cy="23" r="2.5" fill="#34d399"/><rect class="ln" x="28" y="38" width="52" height="8" rx="4" fill="#184332"/><rect x="28" y="51" width="36" height="5" rx="2.5" fill="#cfe0d6"/><rect x="28" y="64" width="92" height="16" rx="6" fill="#e9fbdc" stroke="#184332" stroke-width="2"/><rect class="btn" x="96" y="67" width="21" height="10" rx="4" fill="#92ef59"/><g class="globe"><circle cx="104" cy="45" r="11" fill="none" stroke="#184332" stroke-width="2.5"/><path d="M93 45h22M104 34c-6 7-6 15 0 22M104 34c6 7 6 15 0 22" stroke="#184332" stroke-width="2" fill="none"/></g><path class="cursor" d="M120 82l14 6-6 2-2 6z" fill="#184332"/></svg>
