<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 110"><style>.bot{animation:hover 3s ease-in-out infinite}.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}.ant{animation:glow 1.6s ease-in-out infinite}.sp{transform-box:fill-box;transform-origin:center;animation:twinkle 2s ease-in-out infinite}.sp2{animation-delay:.7s}.sp3{animation-delay:1.4s}.halo{transform-box:fill-box;transform-origin:center;animation:halo 3s ease-in-out infinite}@keyframes hover{50%{transform:translateY(-4px)}}@keyframes blink{0%,44%,52%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}@keyframes glow{50%{fill:#fff}}@keyframes twinkle{0%,100%{transform:scale(.6) rotate(0);opacity:.4}50%{transform:scale(1.15) rotate(45deg);opacity:1}}@keyframes halo{50%{transform:scale(1.06)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><circle class="halo" cx="80" cy="58" r="44" fill="#e9fbdc"/><g class="bot"><path d="M80 16v10" stroke="#184332" stroke-width="3" stroke-linecap="round"/><circle class="ant" cx="80" cy="13" r="5" fill="#92ef59" stroke="#184332" stroke-width="2.5"/><rect x="48" y="28" width="64" height="50" rx="16" fill="#184332"/><rect x="56" y="38" width="48" height="26" rx="10" fill="#0f2e22"/><circle class="eye" cx="69" cy="51" r="5" fill="#92ef59"/><circle class="eye" cx="91" cy="51" r="5" fill="#92ef59"/><path d="M72 70h16" stroke="#92ef59" stroke-width="3" stroke-linecap="round"/><rect x="40" y="44" width="8" height="18" rx="4" fill="#184332"/><rect x="112" y="44" width="8" height="18" rx="4" fill="#184332"/><path d="M60 78h40l6 18H54z" fill="#184332"/></g><path class="sp" d="M128 20l2.5 7 7 2.5-7 2.5-2.5 7-2.5-7-7-2.5 7-2.5z" fill="#92ef59" stroke="#184332" stroke-width="1.5" stroke-linejoin="round"/><path class="sp sp2" d="M24 74l1.8 5 5 1.8-5 1.8-1.8 5-1.8-5-5-1.8 5-1.8z" fill="#184332"/><path class="sp sp3" d="M136 80l1.5 4 4 1.5-4 1.5-1.5 4-1.5-4-4-1.5 4-1.5z" fill="#92ef59"/></svg>
